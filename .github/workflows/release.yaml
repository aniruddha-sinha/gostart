name: Release

on:
  push:
    # Trigger only on semantic version tags (e.g., v1.0.0, v2.1.3-beta)
    tags:
      - "v*.*.*" 

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Required to allow the Action to publish a Release on your repository
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required by GoReleaser to read the commit history for the changelog
          fetch-depth: 0 

      # Replaced actions/setup-go with mise to maintain a single source of truth
      - name: Setup mise and install tools
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          # Automatically provided by GitHub Actions to authenticate the upload
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}